# Blueprint opcional de Render (Infrastructure as Code). La guía usa el formulario web; este archivo es equivalente.
services:
  - type: web
    name: api-estudiantes-iesrfa
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: produccion
      - key: MODO_DEBUG
        value: "False"
      - key: API_SECRET_KEY
        sync: false   # se escribe a mano en el Dashboard (nunca en Git)
